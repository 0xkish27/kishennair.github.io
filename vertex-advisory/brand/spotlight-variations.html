<title>Vertex Spotlight Variations</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#000;--card:#0B0B0C;--line:#232326;--fg:#fff;--mute:#8B8B93;--up:#F2B35A;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 "Schibsted Grotesk",Arial,sans-serif;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:72px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:400 clamp(40px,5.4vw,68px)/1.05 "Newsreader",Georgia,serif;letter-spacing:-.015em;margin:0;text-wrap:balance}
h1 em{display:block;font-style:italic;font-weight:300;color:#E6DCCB}
.intro{color:var(--mute);margin-top:18px;font-size:17px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:52px}
.opt{border:1px solid var(--line);border-radius:24px;background:var(--card);overflow:hidden;min-width:0;display:flex;flex-direction:column;transition:border-color .3s}
.opt:hover{border-color:rgba(242,179,90,.45)}
.stage{display:grid;place-items:center;padding:52px 20px 44px;border-bottom:1px solid var(--line);background:radial-gradient(60% 70% at 50% 40%,rgba(242,179,90,.08),transparent 70%);color:#fff;gap:34px}
.hero-mark{width:132px;height:132px;display:block;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.opt:hover .hero-mark{transform:scale(1.06)}
.lockup{display:flex;align-items:center;gap:14px}
.lockup svg{width:46px;height:46px;flex:none}
.wm b{display:block;font:400 34px/1 "Newsreader",Georgia,serif;letter-spacing:-.01em}
.wm span{display:block;font:600 9.5px/1 "Schibsted Grotesk",sans-serif;letter-spacing:.42em;color:var(--mute);margin-top:7px}
.meta{padding:22px 26px 26px;display:flex;flex-direction:column;gap:8px}
.tag{font:600 12px/1 "Schibsted Grotesk",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--up)}
.meta h2{font:400 28px/1.1 "Newsreader",Georgia,serif;margin:4px 0 0}
.meta p{color:var(--mute);margin:0;font-size:15px}
.minis{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}
.minis span{display:grid;place-items:center;width:52px;height:52px;border-radius:14px;border:1px solid var(--line);background:#000;color:#fff}
.minis span.l{background:#F4F1EA;color:#0B0B0C;border-color:#F4F1EA}
.minis span.r{border-radius:50%}
.minis svg{width:30px;height:30px}
.minis small{color:var(--mute);font-size:13px;margin-left:4px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
</style>

<div class="wrap">
  <h1>The Spotlight, <em>eight new ways.</em></h1>
  <p class="intro">Same idea as Option G: everything in Web3 narrowing into one point. Each version gives the inner lines a different character. Shown large, in the full lockup, and at avatar size on dark and light.</p>
  <div class="grid" id="grid"></div>
</div>

<script>
const O=[['g1','G1 · Light','Light Rays','Inner lines become tapered beams of light, wide and faint at the top, bright where they meet the gold point.'],
['g2','G2 · Network','Constellation','Each beam starts from its own node, at different heights, like partners across the map all routing to Vertex.'],
['g3','G3 · Motion','The Fan','The inner lines curve gently into the point, like a fan opening. Softer and more elegant.'],
['g4','G4 · Flow','Particles','Each beam is a trail of dots that grow brighter and bigger as they reach the point. Feels alive and moving.'],
['g5','G5 · Craft','String Art','Gold strings woven between the two arms, forming a curved net inside the V. Intricate but still clean.'],
['g6','G6 · Bold','Sunburst','Solid gold slices of light fanning out from the point. The boldest version, strongest as an avatar.'],
['g7','G7 · Speed','Comets','Faint guide lines with gold comets racing down each one at different points. Deals in motion.'],
['g8','G8 · Premium','The Prism','Beams of different weights and shades of gold and white, like light split through a prism. Rich but balanced.']];
const use=(id,c='')=>`<svg viewBox="0 0 64 64" class="${c}" aria-hidden="true"><use href="#${id}"/></svg>`;
document.getElementById('grid').innerHTML=O.map(([id,tag,name,desc])=>`
<div class="opt"><div class="stage">${use(id,'hero-mark')}<div class="lockup">${use(id)}<div class="wm"><b>Vertex</b><span>ADVISORY</span></div></div></div>
<div class="meta"><span class="tag">Option ${tag}</span><h2>${name}</h2><p>${desc}</p>
<div class="minis"><span>${use(id)}</span><span class="r">${use(id)}</span><span class="l">${use(id)}</span><small>Avatar sizes</small></div></div></div>`).join('');
</script>
