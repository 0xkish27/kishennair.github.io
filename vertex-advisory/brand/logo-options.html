<title>Vertex Logo Options</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#000;--card:#0B0B0C;--line:#232326;--fg:#fff;--mute:#8B8B93;--up:#F2B35A;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 "Schibsted Grotesk",Arial,sans-serif;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:72px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:400 clamp(40px,5.4vw,68px)/1.05 "Newsreader",Georgia,serif;letter-spacing:-.015em;margin:0;text-wrap:balance}
h1 em{display:block;font-style:italic;font-weight:300;color:#E6DCCB}
.intro{color:var(--mute);margin-top:18px;font-size:17px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:52px}
.opt{border:1px solid var(--line);border-radius:24px;background:var(--card);overflow:hidden;min-width:0;display:flex;flex-direction:column;transition:border-color .3s}
.opt:hover{border-color:rgba(242,179,90,.45)}
.stage{display:grid;place-items:center;padding:52px 20px 44px;border-bottom:1px solid var(--line);background:radial-gradient(60% 70% at 50% 40%,rgba(242,179,90,.08),transparent 70%);color:#fff;gap:34px}
.hero-mark{width:132px;height:132px;display:block;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.opt:hover .hero-mark{transform:scale(1.06)}
.lockup{display:flex;align-items:center;gap:14px}
.lockup svg{width:46px;height:46px;flex:none}
.wm b{display:block;font:400 34px/1 "Newsreader",Georgia,serif;letter-spacing:-.01em}
.wm span{display:block;font:600 9.5px/1 "Schibsted Grotesk",sans-serif;letter-spacing:.42em;color:var(--mute);margin-top:7px}
.meta{padding:22px 26px 26px;display:flex;flex-direction:column;gap:8px}
.tag{font:600 12px/1 "Schibsted Grotesk",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--up)}
.meta h2{font:400 28px/1.1 "Newsreader",Georgia,serif;margin:4px 0 0}
.meta p{color:var(--mute);margin:0;font-size:15px}
.minis{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}
.minis span{display:grid;place-items:center;width:52px;height:52px;border-radius:14px;border:1px solid var(--line);background:#000;color:#fff}
.minis span.l{background:#F4F1EA;color:#0B0B0C;border-color:#F4F1EA}
.minis span.r{border-radius:50%}
.minis svg{width:30px;height:30px}
.minis small{color:var(--mute);font-size:13px;margin-left:4px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<linearGradient id="goldv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2B35A" stop-opacity="0"/><stop offset="1" stop-color="#F2B35A"/></linearGradient>
<linearGradient id="fadev" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".15"/><stop offset="1" stop-color="currentColor" stop-opacity=".9"/></linearGradient>

<div class="wrap">
  <h1>Vertex logo options. <em>Sixteen directions.</em></h1>
  <p class="intro">Each one keeps the gold point where everything meets. Every card shows the mark, the full lockup, and how it looks small as an X, Telegram or Instagram avatar, on dark and light.</p>
  <div class="grid" id="grid"></div>
</div>

<script>
const O=[
['mA','A · Global','The Globe','A V drawn from the meridians of a globe, landing on one gold point. Worldwide reach and one hub in a single mark.'],
['mB','B · Premium','The Gem','A cut-stone V made of four facets, half white and half gold. Feels valuable and solid, and reads clearly even at tiny sizes.'],
['mC','C · Network','The Network','A V built from linked nodes, with every line running down to the gold hub. The clearest picture of what Vertex does.'],
['mD','D · Bold','The Meeting Point','Two strokes from opposite sides cross at the bottom, one white and one gold. Two parties meeting through Vertex. Very modern and simple.'],
['mE','E · Global','The Orbit','A V wrapped by a gold orbit with a satellite. Movement and global reach, with a slightly space-tech feel.'],
['mF','F · Heritage','The Crest','A seal with the name running around the rim and a serif V in the middle. Feels like an established advisory firm or private bank.'],
['mG','G · Focus','The Spotlight','Beams of light from every direction narrowing into one point. Everyone in Web3, focused into one intro.'],
['mH','H · Premium','The Diamond','A V with a faint mirrored peak above it, forming a diamond. The bottom half carries the weight and the gold point.'],
['mI','I · App icon','The Tile','A gold tile with a dark V cut into it. Made for app icons and profile pictures, where it stands out instantly in a feed.'],
['mJ','J · Crypto','The Coin','A gold coin with a milled edge and a V stamped in the centre. Speaks crypto straight away.'],
['mK','K · Motion','The Descent','Three stacked chevrons getting brighter as they fall, landing in gold. Momentum, and everything flowing to one place.'],
['mL','L · Blockchain','The Block','A V set inside an isometric block. Blockchain-native, with the gold point where every side meets.'],
['mM','M · Connection','The Link','Two chain links, one white and one gold, joined at the bottom into a V. Two sides linked through Vertex.'],
['mN','N · Ambition','The Summit','Vertex means the highest point. A peak with a gold point at the top, like reaching the top of the market.'],
['mO','O · Guidance','The Compass','A compass star whose south point is gold. Advisory, direction, and showing clients where to go next.'],
['mP','P · Signature','The Signature','A handwritten-style serif V with a gold underline. Quiet and confident, like a founder’s signature on a deal.'],
];
const use=(id,c='')=>`<svg viewBox="0 0 64 64" class="${c}" aria-hidden="true"><use href="#${id}"/></svg>`;
document.getElementById('grid').innerHTML=O.map(([id,tag,name,desc])=>`
<div class="opt"><div class="stage">${use(id,'hero-mark')}<div class="lockup">${use(id)}<div class="wm"><b>Vertex</b><span>ADVISORY</span></div></div></div>
<div class="meta"><span class="tag">Option ${tag}</span><h2>${name}</h2><p>${desc}</p>
<div class="minis"><span>${use(id)}</span><span class="r">${use(id)}</span><span class="l">${use(id)}</span><small>Avatar sizes</small></div></div></div>`).join('');
</script>
